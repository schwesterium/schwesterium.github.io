    <div class="script-doc">
        <h1>FixedCameraShaker</h1>
        <p>
            固定カメラ用の振動スクリプト。
            カメラにアタッチして <code>CameraShake()</code> を呼ぶと、X・Y方向にランダムに揺れる。
        </p>
    </div>

    <div class="impl-note">
        <p>継承 : <code>MonoBehaviour</code></p>
    </div>

    <div id="static-functions">
        <h1>Static関数</h1>
        <table>
            <thead>
                <tr>
                    <th>定義</th>
                    <th>関数の説明</th>
                    <th>戻り値の説明</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><code>void CameraShake(float duration, float magnitude)</code></td>
                    <td>カメラを揺らす<br>duration: 振動時間(秒), magnitude: 振動の強さ</td>
                    <td><code>void</code></td>
                </tr>
            </tbody>
        </table>
    </div>

<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Pair - Schwesterium Library スクリプトリファレンス</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/SchwesteriumLibraryDocs/docs.css">
</head>

<body>

    <div class="script-doc">
        <h1>Pair&lt;T1,T2&gt;</h1>
        <p>
            2つの値を保持するデータ構造。
            これらのデータはシリアライズできるため、Inspector上から値の変更ができる。
        </p>
    </div>

    <div id="constructor">
        <h1>コンストラクタ</h1>
        <table>
            <thead>
                <tr>
                    <th>定義</th>
                    <th>引数</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><code>Pair(T1 first, T2 second)</code></td>
                    <td>
                        first: 1番目<br>
                        second: 2番目
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div id="variables">
        <h1>変数</h1>
        <table>
            <thead>
                <tr>
                    <th>名前</th>
                    <th>型</th>
                    <th>説明</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><code>First</code></td>
                    <td><code>T1</code></td>
                    <td>1つ目の要素</td>
                </tr>
                <tr>
                    <td><code>Second</code></td>
                    <td><code>T2</code></td>
                    <td>2つ目の要素</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

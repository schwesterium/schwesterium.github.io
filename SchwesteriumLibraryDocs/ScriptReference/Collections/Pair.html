<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Pair - Schwesterium Library スクリプトリファレンス</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- <link rel="stylesheet" href="index.css"> -->
</head>

<body>
    <h3>Pair&lt;T1,T2&gt;</h3>
    <p>
        2つの値を保持するデータ構造。
        これらのデータはシリアライズできるため、Inspector上から値の変更ができる。
    </p>

    <h4 id="constructor">コンストラクタ</h4>
    <p><code>Pair(T1 first, T2 second)</code></p>

    <h4 id="-variables">変数</h4>
    <table>
        <thead>
            <tr>
                <th>名前</th>
                <th>型</th>
                <th>説明</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><code>First</code></td>
                <td><code>T1</code></td>
                <td>1つ目の要素</td>
            </tr>
            <tr>
                <td><code>Second</code></td>
                <td><code>T2</code></td>
                <td>2つ目の要素</td>
            </tr>
        </tbody>
    </table>
</body>
